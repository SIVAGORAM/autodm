services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heylaunch
      POSTGRES_USER: heylaunch
      POSTGRES_PASSWORD: heylaunch-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heylaunch -d heylaunch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
      target: build
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    environment: &backend_environment
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://heylaunch:heylaunch-local-only@postgres:5432/heylaunch?schema=public
      DIRECT_URL: postgresql://heylaunch:heylaunch-local-only@postgres:5432/heylaunch?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRE_NOEVICTION: "true"
      JWT_ACCESS_SECRET: local-development-access-secret-change-before-use
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-before-use
      ENCRYPTION_KEY: local-development-encryption-secret-change-before-use
      META_GRAPH_VERSION: v26.0
      META_WEBHOOK_VERIFY_TOKEN: local-development-webhook-verify-token
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_URL: http://localhost:4000
      WEBHOOK_PAYLOAD_RETENTION_DAYS: "30"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SUPPORT_NOTIFICATION_EMAIL: ${SUPPORT_NOTIFICATION_EMAIL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  worker:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
      target: build
    command: ["node", "dist/worker.js"]
    environment:
      <<: *backend_environment
      # Compose uses the isolated local Mailpit SMTP service, so verification
      # and reset messages are delivered to the local inbox during development.
      # Instagram delivery and scheduled maintenance remain disabled.
      RUN_MAIL_OUTBOX_WORKER_IN_DEVELOPMENT: "true"
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

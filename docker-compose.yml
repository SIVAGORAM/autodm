version: '3.9'

services:
  # ─── Backend API ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autodm-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
    env_file:
      - ./backend/.env
    networks:
      - autodm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis

  # ─── Redis (local dev only — use Upstash in production) ──────────
  redis:
    image: redis:7-alpine
    container_name: autodm-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - autodm-network
    profiles:
      - local  # Only runs in local profile, not production

  # ─── Nginx reverse proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: autodm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - autodm-network
    depends_on:
      - backend

volumes:
  redis_data:
  nginx_logs:

networks:
  autodm-network:
    driver: bridge
